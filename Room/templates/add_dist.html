{% extends 'navigation.html' %}
{% block body %}
<style>
/* === Global Reset === */
* {
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

/* === Background === */
body {
  background: linear-gradient(135deg, #e3f2fd, #ffffff);
  margin: 0;
  padding: 0;
}

/* === Main Container === */
.container {
  margin-top: 80px;
  width: 50%;
  background: #f8faff;
  padding: 40px 50px;
  border-radius: 15px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  text-align: center;
  transition: all 0.3s ease;
}
.container:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

/* === Headings === */
h3 {
  font-weight: 600;
  color: #20305E;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}

/* === Labels & Inputs === */
select,
input[type=text],
input[type=password] {
  width: 600px;
  height: 38px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1.5px solid #ccc;
  font-size: 15px;
  transition: all 0.3s ease;
}

input:focus,
select:focus {
  border-color: #20305E;
  box-shadow: 0 0 8px rgba(32,48,94,0.3);
  outline: none;
}

/* === Buttons === */
input[type=submit] {
  background-color: #20305E;
  color: white;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  padding: 10px 30px;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 10px;
}

input[type=submit]:hover {
  background-color: #EE1D29;
  transform: scale(1.05);
}

/* === Responsive Design === */
@media (max-width: 768px) {
  .container {
    width: 90%;
  }

  select,
  input[type=text],
  input[type=password] {
    width: 100%;
  }
}
</style>

<div align="center" class="container">
  <h3><strong>🏙️ Add District</strong></h3>
  <hr style="width:60%;margin:auto;margin-bottom:30px;border-top:2px solid #20305E;">
  <form method="post" action="">
    {% csrf_token %}
    <label for="state" style="font-weight:600;color:#20305E;">State</label><br>
    <select name="state">
      {% for i in state %}
      <option value="{{i.name}}" {% if selected_state_id and selected_state_id == i.id %}selected{% endif %}>{{i.name}}</option>
      {% endfor %}
    </select><br><br>

    <label for="dist" style="font-weight:600;color:#20305E;">District</label><br>
    <input type="text" placeholder="Enter District name" name="dist" required><br><br>

    <input type="submit" value="Submit">
  </form>
</div>
{% endblock %}
