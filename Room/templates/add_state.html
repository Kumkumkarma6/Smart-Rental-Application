{% extends 'navigation.html' %}
{% block body %}
<style>
/* === Reset & Font === */
* {
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

/* === Background === */
body {
  background: linear-gradient(135deg, #e3f2fd, #ffffff);
  margin: 0;
  padding: 0;
}

/* === Main Container === */
.form-box {
  width: 50%;
  margin: 80px auto;
  background: #f8faff;
  padding: 40px 50px;
  border-radius: 15px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  text-align: center;
  transition: all 0.3s ease;
}

.form-box:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 28px rgba(0,0,0,0.2);
}

/* === Heading === */
h3 {
  font-weight: 600;
  color: #20305E;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}

/* === Divider === */
hr {
  width: 60%;
  margin: 20px auto;
  border-top: 2px solid #20305E;
}

/* === Inputs === */
input[type=text],
input[type=password] {
  width: 600px;
  height: 38px;
  border: 1.5px solid #ccc;
  border-radius: 8px;
  padding: 10px 15px;
  font-size: 15px;
  transition: all 0.3s ease;
}

input:focus {
  border-color: #20305E;
  box-shadow: 0 0 8px rgba(32,48,94,0.3);
  outline: none;
}

/* === Button === */
input[type=submit] {
  background-color: #20305E;
  color: white;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  padding: 10px 30px;
  cursor: pointer;
  margin-top: 15px;
  transition: all 0.3s ease;
}

input[type=submit]:hover {
  background-color: #EE1D29;
  transform: scale(1.05);
  box-shadow: 0 4px 10px rgba(238,29,41,0.4);
}

/* === Responsive Design === */
@media (max-width: 768px) {
  .form-box {
    width: 90%;
    padding: 30px;
  }
  input[type=text],
  input[type=password] {
    width: 100%;
  }
}
</style>

<div class="form-box">
  <h3>🌍 <strong>Add State</strong></h3>
  <hr>
  <form method="post" action="">
    {% csrf_token %}
    <label for="state" style="font-weight:600;color:#20305E;">State</label><br>
    <input type="text" placeholder="Enter State name" name="state" required><br><br>
    <input type="submit" value="Register">
  </form>
</div>
{% endblock %}
