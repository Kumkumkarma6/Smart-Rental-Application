{% extends 'navigation.html' %}
{% block body %}
<style>
/* --- Page background --- */
body {
  background: linear-gradient(135deg, #99DBF9 20%, #20305E 80%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  color: #333;
}

/* --- Container Box --- */
.edit-container {
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
  padding: 50px 60px;
  width: 480px;
  text-align: center;
  animation: fadeIn 0.8s ease-in-out;
}

/* --- Heading --- */
.edit-container h3 {
  color: #20305E;
  margin-bottom: 15px;
  font-size: 28px;
  font-weight: 600;
}

/* --- Divider Line --- */
.edit-container hr {
  width: 60%;
  margin: 10px auto 30px;
  border: 1px solid #99DBF9;
}

/* --- Input Field --- */
.edit-container input[type="text"] {
  width: 100%;
  padding: 12px 15px;
  border: 2px solid #99DBF9;
  border-radius: 10px;
  outline: none;
  font-size: 16px;
  transition: 0.3s ease;
  margin-bottom: 25px;
}

.edit-container input[type="text"]:focus {
  border-color: #20305E;
  box-shadow: 0 0 8px rgba(32, 48, 94, 0.3);
}

/* --- Submit Button --- */
.edit-container input[type="submit"] {
  background: #20305E;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 40px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s ease;
}

.edit-container input[type="submit"]:hover {
  background: #162040;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(32, 48, 94, 0.3);
}

/* --- Animation --- */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* --- Responsive --- */
@media (max-width: 600px) {
  .edit-container {
    width: 90%;
    padding: 30px;
  }
  .edit-container input[type="submit"] {
    width: 100%;
  }
}
</style>

{% if error %}
<script>
alert('Edited State Successfully');
window.location='{% url 'view_state' %}';
</script>
{% endif %}

<div class="edit-container">
  <h3><strong>Edit State</strong></h3>
  <hr>
  <form method="post" action="">
    {% csrf_token %}
    <label for="state" style="font-weight:500;">State</label><br>
    <input type="text" id="state" value="{{data.name}}" name="state" placeholder="Enter State Name">
    <input type="submit" value="Submit">
  </form>
</div>
{% endblock %}
