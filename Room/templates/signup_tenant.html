{% extends 'navigation.html' %}
{% block body %}

<style>
  .signup-container {
    min-height: calc(100vh - 100px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 0;
    background: #f5f7fa;
  }

  .signup-box {
    background: white;
    border-radius: 16px;
    padding: 40px;
    width: 500px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    animation: fadeInUp 1s ease;
  }

  .signup-box h3 {
    color: #20305E;
    font-weight: 600;
    margin-bottom: 25px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
  }

  hr {
    border-top: 2px solid #2f80ed;
    width: 80px;
    margin: 0 auto 25px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 8px;
  }

  .form-group input {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #cfd8dc;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.3s ease;
    box-sizing: border-box;
  }

  .form-group input:focus {
    border-color: #2f80ed;
    box-shadow: 0 0 8px rgba(47, 128, 237, 0.3);
    outline: none;
  }

  .alert {
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
  }

  .alert-danger {
    background: #fee;
    color: #c33;
    border: 1px solid #fcc;
  }

  .alert-success {
    background: #efe;
    color: #3c3;
    border: 1px solid #cfc;
  }

  .btn-submit {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #20305E, #2f80ed);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 20px;
  }

  .btn-submit:hover {
    background: #2f80ed;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(47, 128, 237, 0.3);
  }

  .form-text {
    text-align: center;
    margin-top: 20px;
    color: #7f8c8d;
    font-size: 14px;
  }

  .form-text a {
    color: #2f80ed;
    text-decoration: none;
    font-weight: 600;
  }

  .back-link {
    text-align: center;
    margin-bottom: 20px;
  }

  .back-link a {
    color: #2f80ed;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 600px) {
    .signup-box {
      width: 90%;
      padding: 30px 20px;
    }
  }
</style>

<div class="signup-container">
  <div class="signup-box">
    <div class="back-link">
      <a href="{% url 'signup_role' %}" onclick="history.back()">← Back</a>
    </div>
    <h3>Tenant Sign Up</h3>
    <hr>

    {% if error %}
      {% if error == 'success' %}
        <div class="alert alert-success">
          ✓ Account created successfully! You can now <a href="{% url 'signin' %}">Sign In</a>
        </div>
      {% else %}
        <div class="alert alert-danger">
          ✗ {{ error }}
        </div>
      {% endif %}
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}

      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="uname">Username:</label>
        <input type="text" id="uname" name="uname" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="form-text">
      Already have an account? <a href="{% url 'signin_role' %}">Sign In</a>
    </div>
  </div>
</div>

{% endblock %}
