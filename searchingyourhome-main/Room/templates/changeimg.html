{% extends 'navigation.html' %}
{% block body %}

<style>
/* === General Reset === */
* {
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

/* === Background === */
body {
  background: linear-gradient(to right, #99DBF9, #20305E);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* === Header Box === */
.container2 {
  width: 50%;
  background: #20305E;
  color: white;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 20px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  animation: fadeDown 0.8s ease-in-out;
}

.container2 h3 {
  font-size: 22px;
  letter-spacing: 1px;
}

/* === Form Box === */
.container {
  width: 50%;
  background: #f9fcff;
  border-radius: 10px;
  padding: 30px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  animation: fadeUp 0.8s ease-in-out;
}

/* === Input Styles === */
input[type=text], input[type=number], input[type=file], select, textarea {
  width: 100%;
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 6px;
  transition: all 0.3s ease;
}

input[type=text]:focus, input[type=file]:focus {
  border-color: #20305E;
  box-shadow: 0 0 5px rgba(32,48,94,0.4);
  outline: none;
}

/* === Labels & Columns === */
label {
  display: inline-block;
  font-weight: 600;
  margin-bottom: 5px;
}

.row {
  margin-bottom: 15px;
}

.col-25 {
  width: 25%;
  float: left;
  margin-top: 6px;
}

.col-75 {
  width: 75%;
  float: left;
  margin-top: 6px;
}

/* === Submit Button === */
#id1 {
  background: #20305E;
  color: white;
  padding: 12px 30px;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  float: right;
  transition: 0.3s ease;
}

#id1:hover {
  background-color: #16234a;
  transform: translateY(-2px);
}

/* === Responsive Design === */
@media screen and (max-width: 768px) {
  .container, .container2 {
    width: 90%;
  }
  .col-25, .col-75 {
    width: 100%;
    float: none;
  }
}

/* === Animations === */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

<!-- === Alert (Optional) === -->
<script>
  window.addEventListener('DOMContentLoaded', () => {
    alert("Changed Room's Image Successfully");
  });
</script>

<!-- === Page Content === -->
<div class="container2">
  <h3>Change Room’s Image</h3>
</div>

<div class="container">
  <form action="" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-25">
        <label for="lname">Room Name</label>
      </div>
      <div class="col-75">
        <input type="text" id="lname" name="name" value="{{img.room_name}}" readonly>
      </div>
    </div>

    <div class="row">
      <div class="col-25">
        <label for="lname">Room Image</label>
      </div>
      <div class="col-75">
        <input type="file" id="lname" name="img">
      </div>
    </div>

    <div class="row">
      <input id="id1" type="submit" value="Submit">
    </div>
  </form>
</div>

{% endblock %}
