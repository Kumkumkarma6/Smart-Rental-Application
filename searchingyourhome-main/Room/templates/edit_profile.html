{% extends 'navigation.html' %}
{% block body %}
{% load static %}

<div class="container">
    <div class="edit-profile-wrapper">
        <h2><i class="fas fa-user-edit"></i> Edit Profile</h2>
        
        <form method="POST" enctype="multipart/form-data" class="edit-profile-form">
            {% csrf_token %}
            
            <div class="profile-pic-section">
                <div class="current-pic">
                    {% if profile.profile_picture %}
                        <img src="{{ profile.profile_picture.url }}" alt="Current Profile Picture">
                    {% else %}
                        <i class="fas fa-user-circle"></i>
                    {% endif %}
                </div>
                <div class="upload-section">
                    <label for="profile_picture" class="upload-btn">
                        <i class="fas fa-camera"></i> Change Profile Picture
                    </label>
                    <input type="file" id="profile_picture" name="profile_picture" accept="image/*">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" value="{{ request.user.first_name }}" class="form-control">
                </div>
                
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" value="{{ request.user.last_name }}" class="form-control">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ request.user.email }}" class="form-control">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" value="{{ profile.phone }}" class="form-control" placeholder="Enter your phone number">
                </div>
                
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" value="{{ profile.location }}" class="form-control" placeholder="Enter your location">
                </div>
            </div>
            
            <div class="form-group full-width">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" class="form-control" placeholder="Tell us about yourself">{{ profile.bio }}</textarea>
            </div>
            
            <div class="button-group">
                <button type="submit" class="save-btn">Save Changes</button>
                <a href="{% url 'user_profile' %}" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
.edit-profile-wrapper {
    max-width: 800px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.edit-profile-wrapper h2 {
    color: #20305E;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.edit-profile-wrapper h2 i {
    color: #FF3366;
}

.profile-pic-section {
    text-align: center;
    margin-bottom: 30px;
}

.current-pic {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    margin: 0 auto 20px;
    overflow: hidden;
    border: 5px solid #f0f0f0;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.current-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.current-pic i {
    font-size: 100px;
    color: #ddd;
    line-height: 140px;
}

.upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #20305E;
    color: white;
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.upload-btn:hover {
    background: #FF3366;
}

input[type="file"] {
    display: none;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group.full-width {
    grid-column: 1 / -1;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #666;
    font-weight: 500;
}

.form-control {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s ease;
}

.form-control:focus {
    border-color: #FF3366;
    outline: none;
}

textarea.form-control {
    height: 120px;
    resize: vertical;
}

.button-group {
    display: flex;
    gap: 15px;
    justify-content: flex-end;
}

.save-btn {
    background: linear-gradient(45deg, #FF3366, #FF6B6B);
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 25px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
}

.save-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
}

.cancel-btn {
    background: #f0f0f0;
    color: #666;
    padding: 12px 30px;
    border-radius: 25px;
    text-decoration: none;
    transition: all 0.3s ease;
}

.cancel-btn:hover {
    background: #e0e0e0;
}

@media (max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
    
    .edit-profile-wrapper {
        margin: 15px;
        padding: 20px;
    }
}
</style>
{% endblock %}
