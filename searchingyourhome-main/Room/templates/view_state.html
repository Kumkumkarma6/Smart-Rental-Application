{% extends 'navigation.html' %}
{% block body %}
<style>
body {
  background: linear-gradient(135deg, #f1f7ff, #ffffff);
  font-family: 'Poppins', sans-serif;
}

/* ===== Heading ===== */
.container h2 {
  background-color: #20305E;
  color: white;
  padding: 14px;
  border-radius: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  margin-top: 30px;
}

/* ===== Table Styling ===== */
.table {
  background-color: #ffffff;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 25px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.table thead {
  background-color: #20305E;
  color: white;
  text-transform: uppercase;
  font-size: 14px;
  letter-spacing: 0.5px;
}

.table th, .table td {
  text-align: center;
  padding: 14px;
  vertical-align: middle;
  font-size: 15px;
  color: #333;
}

.table tbody tr:hover {
  background-color: #f0f7ff;
  transform: scale(1.01);
  transition: all 0.2s ease-in-out;
}

/* ===== Buttons ===== */
.button {
  border: none;
  color: white;
  padding: 8px 16px;
  text-align: center;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 0.3s ease, transform 0.2s ease;
  margin: 2px;
}

/* Edit button */
.button1 {
  background-color: #007bff;
}
.button1:hover {
  background-color: #0056b3;
  transform: scale(1.05);
}

/* Delete button */
.button2 {
  background-color: #dc3545;
}
.button2:hover {
  background-color: #a71d2a;
  transform: scale(1.05);
}

/* ===== Responsive Design ===== */
@media (max-width: 768px) {
  .container h2 {
    font-size: 18px;
  }
  .table th, .table td {
    font-size: 13px;
    padding: 10px;
  }
  .button {
    padding: 6px 12px;
    font-size: 13px;
  }
}
</style>

<center>
  <div class="container">
    <h2>View State</h2>
  </div>
</center>

<div class="container">
  <table class="table table-bordered" width="100%" id="myTable">
    <thead>
      <tr>
        <th>Serial No.</th>
        <th>State Name</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for i in state %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ i.state }}</td>
        <td>
          <a href="{% url 'edit_state' i.id %}">
            <button class="button button1">Edit</button>
          </a>
          <a href="{% url 'delete_state' i.id %}">
            <button class="button button2">Delete</button>
          </a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
